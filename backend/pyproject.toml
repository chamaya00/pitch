[project]
name = "vocallens-backend"
version = "0.1.0"
description = "VocalLens backend — audio analysis API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

# ``soundfile`` ships no type information. The import is confined to
# ``services/audio_analysis/analyzer.py``, which wraps it behind the
# ``AudioAnalyzer`` protocol, so the untyped surface stops at one module.
[[tool.mypy.overrides]]
module = ["soundfile"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
