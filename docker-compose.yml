name: vocallens

# Topology, since Step 10.5:
#
#   client -> proxy (the only published port) -> frontend
#                                             -> backend -> db
#
# Only `proxy` publishes a port. The backend, the frontend and PostgreSQL are
# reachable by service name on the internal compose network and by nothing else.
# That is not decoration: it is what makes RATE_LIMIT_TRUSTED_PROXIES=1 sound,
# because the backend's immediate peer can then only ever be the proxy. Republish
# the backend's port and that assumption is void — a client could then reach it
# directly and set its own X-Forwarded-For.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vocallens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocallens}
      POSTGRES_DB: vocallens
    # No published port. Until Step 10.5 this published 5432 to the host with a
    # default password, which put the database — and therefore every recording,
    # bypassing every ownership predicate in the API — one connection away from
    # anyone who could reach the host. Use `docker compose exec db psql` for
    # maintenance instead.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocallens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://vocallens:${POSTGRES_PASSWORD:-vocallens}@db:5432/vocallens
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-50}
      MAX_AUDIO_DURATION_SECONDS: ${MAX_AUDIO_DURATION_SECONDS:-300}
      # Same origin as the frontend now that both are served through the proxy,
      # so CORS no longer carries the identity header across origins. Kept
      # configured because a deployment may still front the two separately.
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      STORAGE_ROOT: /var/lib/vocallens
      # Exactly one trusted hop: the proxy sets X-Forwarded-For to the peer it
      # saw and discards whatever the client sent, so the single value in that
      # header is the real client. Any larger number would start trusting
      # entries no proxy in this deployment wrote.
      RATE_LIMIT_TRUSTED_PROXIES: "1"
      RATE_LIMIT_NEW_IDENTITIES: ${RATE_LIMIT_NEW_IDENTITIES:-20}
      RATE_LIMIT_NEW_IDENTITIES_WINDOW_SECONDS: ${RATE_LIMIT_NEW_IDENTITIES_WINDOW_SECONDS:-3600}
      RATE_LIMIT_COSTLY_REQUESTS: ${RATE_LIMIT_COSTLY_REQUESTS:-60}
      RATE_LIMIT_COSTLY_REQUESTS_WINDOW_SECONDS: ${RATE_LIMIT_COSTLY_REQUESTS_WINDOW_SECONDS:-3600}
      # The backend image runs a single uvicorn worker, and with one worker the
      # in-process counter is exactly correct — it is not a compromise here.
      #
      # Scale this service, or add `--workers` to the image's CMD, and it stops
      # being correct: each worker counts on its own, so the effective limit is
      # multiplied by the worker count. Measured at a limit of 5, four workers
      # allowed 20. Set this to `database` if you do either, and the count moves
      # into a table all of them share.
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      # Connections held by ONE backend process. PostgreSQL's limit is
      # server-wide, so what it sees is this times the number of processes:
      # scale this service, or add `--workers` to the image's CMD, and the
      # ceiling multiplies exactly as the rate-limit counter above does.
      # Measured in Step 10.17: twelve processes of ten took all 97 connections
      # the `postgres:16-alpine` default grants, after which nothing else could
      # connect — including `docker compose exec db psql` and the identity
      # cleanup job. At four, twenty-four processes fit.
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-4}
    expose:
      - "8000"
    volumes:
      # Recordings must outlive the container; without this they vanish on
      # every rebuild.
      - recordings:/var/lib/vocallens
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # The browser now reaches the API through the proxy on the public
        # origin, so this is no longer the backend's own address. It is inlined
        # at build time, which is why it is a build arg rather than an env var.
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-http://localhost}
    expose:
      - "3000"
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    environment:
      VL_LISTEN_PORT: "80"
      VL_ACCESS_LOG: /var/log/nginx/access.log
      VL_BACKEND: backend:8000
      VL_FRONTEND: frontend:3000
      # Where envsubst leaves the shared body. A variable rather than a literal
      # so the same template file also runs under `scripts/verify-proxy.sh`,
      # which substitutes it somewhere else — the shipped config and the one
      # that gets exercised are then the same file, not two that resemble
      # each other.
      VL_INCLUDE: /etc/nginx/conf.d/_vocallens.inc
      # Kept EQUAL to the backend's MAX_AUDIO_SIZE_MB, not larger. A gap
      # between them is a range of body sizes that nginx forwards and the
      # application then refuses mid-stream, which nginx reports as 502 — see
      # the template for the measurement. `test_deployment.py` fails if the two
      # ever drift apart.
      VL_EDGE_MAX_BODY_MB: ${MAX_AUDIO_SIZE_MB:-50}
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      # The official image runs envsubst over everything here at start-up.
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      # The shared body of the proxy, mounted as a single file *into* the
      # template directory so envsubst reaches it. It lives outside both
      # template directories because the TLS deployment mounts a different one
      # over the line above and must still get this exact file — one copy, two
      # entry points. It is substituted to `_vocallens.inc`, which the image's
      # `include conf.d/*.conf` deliberately does not match.
      - ./deploy/nginx/common/_vocallens.inc.template:/etc/nginx/templates/_vocallens.inc.template:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  recordings:
