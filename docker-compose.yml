name: vocallens

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vocallens
      POSTGRES_PASSWORD: vocallens
      POSTGRES_DB: vocallens
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocallens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://vocallens:vocallens@db:5432/vocallens
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-50}
      MAX_AUDIO_DURATION_SECONDS: ${MAX_AUDIO_DURATION_SECONDS:-300}
      CORS_ORIGINS: http://localhost:3000
      STORAGE_ROOT: /var/lib/vocallens
    ports:
      - "8000:8000"
    volumes:
      # Recordings must outlive the container; without this they vanish on
      # every rebuild.
      - recordings:/var/lib/vocallens
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  recordings:
